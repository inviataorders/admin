<div class="app">
<section id="loginScreen" class="login"><div class="login-card glass"><div class="brand"><span class="dot"></span><span>inviata os</span></div><h2>Admin Login</h2><p>Internal workspace for invitation review, approval, and template preparation.</p><form id="loginForm" class="form" novalidate><div class="field" id="userField"><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Enter username" /><div class="error" id="userError"></div></div><div class="field" id="passField"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" /><div class="error" id="passError"></div></div><button class="btn" type="submit">Enter</button><div class="error" id="formError"></div></form></div></section>
<section id="dash" class="hidden">
<header class="topbar">
<div class="topbar-side topbar-side-left">
<div class="view-switch" aria-label="Workspace Switch">
<button id="ordersViewBtn" class="switch-btn active" type="button">Orders</button>
<button id="templatesViewBtn" class="switch-btn" type="button">Templates</button>
</div>
</div>
<div class="brand"><span class="dot"></span><h1>inviata os</h1></div>
<div class="topbar-side topbar-side-right"><button id="logoutBtn" class="ghost" type="button">Log Out</button></div>
</header>
<main id="ordersShell" class="shell"><div class="layout"><aside class="rail glass"><div class="toolbar"><input id="searchInput" placeholder="Search order / bride / groom" /><div class="filters"><select id="statusFilter"></select><select id="templateFilter"></select><input id="dateFilter" type="date" aria-label="Date Filter" title="Date Filter" /></div></div><div class="orders" id="orders"></div></aside><section class="content glass"><div class="body-scroll" id="workspace"></div></section></div></main>
<main id="templatesShell" class="shell hidden"><div class="layout"><aside class="rail glass"><div class="toolbar registry-toolbar"><div class="action-row"><button id="registerTemplateBtn" class="btn" type="button">Register Template</button></div><input id="templateRegistrySearch" placeholder="Search template / category / ID" /><div class="filters registry-filters"><select id="templateRegistryStatusFilter"></select></div></div><div class="orders" id="templateRegistryList"></div></aside><section class="content glass"><div class="body-scroll" id="templateRegistryWorkspace"></div></section></div></main>
</section>
<div id="orderModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3>Order Details</h3><button class="ghost" id="closeOrderModal" type="button">Close</button></div><div id="orderModalBody"></div></div></div>
<div id="imageModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="imageModalTitle">Reference Preview</h3><button class="ghost" id="closeImageModal" type="button">Close</button></div><div id="imageModalBody"></div></div></div>
<div id="clientModal" class="modal hidden"><div class="modal-card small"><div class="modal-head"><h3>Client Information</h3><button class="ghost" id="closeClientModal" type="button">Close</button></div><div id="clientModalBody"></div></div></div>
<div id="generationModal" class="modal hidden"><div class="modal-card medium"><div class="modal-head"><h3>Upload all images</h3><button class="ghost" id="closeGenerationModal" type="button">Close</button></div><div id="generationModalBody"></div></div></div>
</div>
